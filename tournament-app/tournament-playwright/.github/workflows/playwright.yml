name: Playwright Core Tests

on:
  workflow_dispatch:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]

jobs:
  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - run: npm run typecheck
      - run: npm test
        env:
          PLAYWRIGHT_BASE_URL: ${{ secrets.PLAYWRIGHT_BASE_URL }}
          PLAYWRIGHT_ORGANIZER_EMAIL: ${{ secrets.PLAYWRIGHT_ORGANIZER_EMAIL }}
          PLAYWRIGHT_ORGANIZER_PASSWORD: ${{ secrets.PLAYWRIGHT_ORGANIZER_PASSWORD }}
          PLAYWRIGHT_COMPETITOR_EMAIL: ${{ secrets.PLAYWRIGHT_COMPETITOR_EMAIL }}
          PLAYWRIGHT_COMPETITOR_PASSWORD: ${{ secrets.PLAYWRIGHT_COMPETITOR_PASSWORD }}
